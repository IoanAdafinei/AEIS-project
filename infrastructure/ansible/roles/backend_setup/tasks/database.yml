---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name: [ "curl", "ca-certificates", "gnupg" ]
    state: present
    update_cache: yes

- name: Download pgAdmin GPG key
  ansible.builtin.get_url:
    url: https://www.pgadmin.org/static/packages_pgadmin_org.pub
    dest: /tmp/pgadmin_org.pub

- name: Dearmor pgAdmin GPG key
  ansible.builtin.shell: gpg --dearmor < /tmp/pgadmin_org.pub >
    /usr/share/keyrings/pgadmin-keyring.gpg
  args:
    creates: /usr/share/keyrings/pgadmin-keyring.gpg

- name: Add pgAdmin APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/pgadmin-keyring.gpg]
      https://ftp.postgresql.org/pub/pgadmin/pgadmin4/apt/{{
      ansible_distribution_release }} pgadmin4 main"
    state: present
    filename: pgadmin4

- name: Install PostgreSQL client
  ansible.builtin.apt:
    name: postgresql-client
    state: present
    update_cache: yes

- name: Copy initialization SQL script to VM
  ansible.builtin.copy:
    src: init_db.sql
    dest: /tmp/init_db.sql

- name: Execute SQL script against Azure Database for PostgreSQL
  ansible.builtin.shell: "psql -U {{ db_user }} -h {{ db_host }} -d {{ db_name }} -f /tmp/init_db.sql"
  environment:
    PGPASSWORD: "{{ db_password }}"
  no_log: true
